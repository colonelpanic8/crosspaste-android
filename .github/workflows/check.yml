name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command python3 scripts/build.py --fetch-inputs --check-inputs
      - run: nix develop --command just check
      - run: nix flake check
