Description: |-
  A separately packaged modification of CrossPaste Android 2.2.2. Sync text,
  images and files across paired devices without device-count or sync-rate
  premium limits. Includes the original Android integrations and bundled SDKs.
  The linked source repository contains patch tooling, not the complete mobile
  application source. This is an unofficial binary repository.
